<!doctype html>
<html lang="en">
  <head>
    <title>JavaScript Control Structures</title>
  </head>
  <body>
    <h1>JavaScript Control Structures</h1>
    <div>
      <h2>1. if / else</h2>
      <script>
        let age = 18;
        if (age >= 18) {
          document.write("<p>You are eligible to vote.</p>");
        } else {
          document.write("<p>You are not eligible to vote.</p>");
        }
      </script>
    </div>

    <div>
      <h2>2. switch</h2>
      <script>
        let day = 3;
        let dayName;

        switch (day) {
          case 1:
            dayName = "Monday";
            break;
          case 2:
            dayName = "Tuesday";
            break;
          case 3:
            dayName = "Wednesday";
            break;
          default:
            dayName = "Another day";
        }

        document.write("<p>Day " + day + " is " + dayName + ".</p>");
      </script>
    </div>

    <div>
      <h2>3. for loop</h2>
      <script>
        document.write("<p>Numbers from 1 to 5: ");
        for (let i = 1; i <= 5; i++) {
          document.write(i + " ");
        }
        document.write("</p>");
      </script>
    </div>

    <div>
      <h2>4. while loop</h2>
      <script>
        let count = 1;
        document.write("<p>");
        while (count <= 5) {
          document.write(count + " ");
          count++;
        }
        document.write("</p>");
      </script>
    </div>

    <div>
      <h2>5. break</h2>
      <script>
        document.write("<p>");
        for (let i = 1; i <= 10; i++) {
          if (i === 6) {
            break;
          }
          document.write(i + " ");
        }
        document.write("</p>");
      </script>
    </div>

    <div>
      <h2>6. continue</h2>
      <script>
        document.write("<p>");
        for (let i = 1; i <= 6; i++) {
          if (i === 3) {
            continue;
          }
          document.write(i + " ");
        }
        document.write("</p>");
      </script>
    </div>
    <div>
      <script>
        document.write("<p>");
        let Age = 10;
        let Grade = "A";
        if (Age >= 20 && Grade === "A") {
          document.write("<p>You have passed.</p>");
        } else {
          document.write("<p>You have failed.</p>");
        }
        document.write("</p>");
      </script>
    </div>
    <div>
      <script>
        let Class = 370;
        let dday = "Thursday";

        switch (Class) {
          case 370:
            switch (dday) {
              case "Monday":
                document.write("<p>CECS 370 is on Monday</p>");
                break;
              case "Tuesday":
                document.write("<p>CECS 370 is on Tuesday</p>");
                break;
              case "Wednesday":
                document.write("<p>CECS 370 is on Wednesday</p>");
                break;
              case "Thursday":
                document.write("<p>CECS 370 is on Thursday</p>");
                break;
              case "Friday":
                document.write("<p>CECS 370 is on Friday</p>");
                break;
              default:
                document.write("<p>Invalid day</p>");
            }

            break;

          default:
            document.write("<p>Some other class</p>");
        }
      </script>
    </div>
    <div>
      <script>
        document.write("<table border='1'>");
        for (let i = 1; i <= 10; i++) {
          document.write("<tr><td>" + i + " x 11 = " + i * 11 + "</td></tr>");
        }
        document.write("</table>");
      </script>
    </div>
    <div>
      <script>
        const array = ["ali", "sufyan", "ahmed", "hassan"];
        for (let i = 0; i < array.length; i++) {
          document.write("<p>" + array[i] + "</p>");
        }
      </script>
    </div>
  </body>
</html>
