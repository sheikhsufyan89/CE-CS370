<doctype! html>
    <html lang="en">
        <head>
            <title>JavaScript Control Structures</title>
        </head>
        <body>
            <h1>JavaScript Control Structures</h1>
            <div>
                <script>
                    const add = (a, b) => a + b;
                    const subtract = (a, b) => a - b;   
                    const multiply = (a, b) => a * b;
                    const divide = (a, b) => a / b;
                    console.log("Addition: " + add(5, 3));
                    console.log("Subtraction: " + subtract(5, 3));
                    console.log("Multiplication: " + multiply(5, 3));
                    console.log("Division: " + divide(5, 3));

                    function sum(...numbers) {
                        return numbers.reduce((total, num) => total + num, 0);
                    }
                    console.log("Sum: " + sum(1, 2, 3, 4, 5));
                    
                    document.write("<button>add</button>" + "<button>subtract</button>" + "<button>multiply</button>" + "<button>divide</button>");
                </script>
            </div>
        </body>

    </html>
</doctype>
